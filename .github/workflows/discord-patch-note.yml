name: Discord Patch Note

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch-note:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord patch note
        env:
          DISCORD_PATCH_WEBHOOK: ${{ secrets.DISCORD_PATCH_WEBHOOK }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("DISCORD_PATCH_WEBHOOK", "").strip()
          if not webhook:
              print("Secret DISCORD_PATCH_WEBHOOK manquant.")
              sys.exit(1)

          commit_message = os.environ.get("COMMIT_MESSAGE", "Mise a jour manuelle") or "Mise a jour manuelle"
          commit_author = os.environ.get("COMMIT_AUTHOR", "GitHub Actions") or "GitHub Actions"
          commit_url = os.environ.get("COMMIT_URL", "")
          run_url = os.environ.get("RUN_URL", "")

          content = f"""PATCH NOTE - Site Prof

Statut : Deploiement lance
Repository : {os.environ.get('REPOSITORY_NAME', '')}
Branche : {os.environ.get('BRANCH_NAME', '')}
Auteur : {commit_author}

Changements :
{commit_message}

Commit :
{commit_url or 'Non disponible'}

Action :
{run_url}
"""

          data = json.dumps({"content": content}).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Discord response: {response.status}")
          PY
