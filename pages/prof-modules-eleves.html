<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modules Élèves - Module 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="../Images/logo.png?v=22">
  <link rel="shortcut icon" type="image/png" href="../Images/logo.png?v=22">
  <link rel="stylesheet" href="../assets/css/base.css?v=1001">
  <link rel="stylesheet" href="../assets/css/header.css?v=1001">
  <link rel="stylesheet" href="../assets/css/buttons.css?v=1001">
  <link rel="stylesheet" href="../assets/css/loader.css?v=1001">
  <link rel="stylesheet" href="../assets/css/prof.css?v=9036">

  <style>
    .modules-shell {
      display: grid;
      gap: 18px;
    }

    .modules-summary {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .modules-stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(214,180,106,.08), rgba(255,255,255,.028)),
        rgba(255,255,255,.025);
    }

    .modules-stat span {
      display: block;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .modules-stat strong {
      display: block;
      color: var(--text);
      font-size: 26px;
      line-height: 1;
      font-weight: 1000;
    }

    .modules-stat.done strong {
      color: #86efac;
    }

    .modules-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: rgba(255,255,255,.030);
    }

    .modules-search {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      outline: none;
    }

    .modules-search:focus {
      border-color: rgba(214,180,106,.42);
      box-shadow: 0 0 0 3px rgba(214,180,106,.10);
    }

    .modules-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
    }

    .modules-status[data-tone="ok"] {
      color: #86efac;
    }

    .modules-status[data-tone="error"] {
      color: #fca5a5;
    }

    .modules-status[data-tone="info"] {
      color: #7dd3fc;
    }

    .modules-table-wrap {
      position: relative;
      min-height: 420px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
    }

    .modules-table {
      min-width: 1040px;
    }

    .modules-row {
      display: grid;
      grid-template-columns: minmax(240px, 1.35fr) 120px repeat(6, minmax(116px, 1fr));
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .modules-row.head {
      position: sticky;
      top: 0;
      z-index: 2;
      background:
        linear-gradient(145deg, rgba(214,180,106,.14), rgba(255,255,255,.035)),
        rgba(12,12,12,.98);
      backdrop-filter: blur(14px);
    }

    .modules-row.head > div {
      padding: 13px 12px;
      color: var(--gold2);
      font-size: 11px;
      font-weight: 1000;
      text-transform: uppercase;
      border-right: 1px solid rgba(255,255,255,.07);
    }

    .modules-cell {
      min-width: 0;
      padding: 11px 12px;
      border-right: 1px solid rgba(255,255,255,.055);
    }

    .modules-student strong,
    .modules-id strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modules-student span,
    .modules-id span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .module-check {
      width: 100%;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid rgba(248,113,113,.28);
      border-radius: 999px;
      background: rgba(248,113,113,.10);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 1000;
      cursor: pointer;
      user-select: none;
      transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
    }

    .module-check:hover {
      transform: translateY(-1px);
    }

    .module-check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #86efac;
      cursor: pointer;
    }

    .module-check.checked {
      border-color: rgba(74,222,128,.38);
      background: rgba(74,222,128,.13);
      color: #86efac;
      box-shadow: 0 0 18px rgba(74,222,128,.10);
    }

    .module-check.saving {
      opacity: .68;
      pointer-events: none;
    }

    .modules-empty,
    .modules-error {
      margin: 14px;
      padding: 18px;
      border: 1px solid rgba(214,180,106,.18);
      border-radius: 8px;
      background: rgba(214,180,106,.08);
      color: var(--gold2);
      font-weight: 1000;
      line-height: 1.45;
      text-align: center;
    }

    .modules-error {
      border-color: rgba(248,113,113,.28);
      background: rgba(248,113,113,.10);
      color: #fca5a5;
    }

    .modules-page-loader {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(8,8,8,.74);
      backdrop-filter: blur(10px);
    }

    .modules-page-loader[hidden] {
      display: none !important;
    }

    .modules-loader-box {
      width: min(360px, 92%);
      padding: 20px;
      border: 1px solid rgba(214,180,106,.24);
      border-radius: 8px;
      background: rgba(18,18,18,.96);
      text-align: center;
    }

    .modules-spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border-radius: 999px;
      border: 3px solid rgba(214,180,106,.18);
      border-top-color: var(--gold2);
      animation: modulesSpin .75s linear infinite;
    }

    @keyframes modulesSpin {
      to { transform: rotate(360deg); }
    }

    .modules-loader-box p {
      margin: 0;
      color: var(--gold2);
      font-size: 13px;
      font-weight: 1000;
    }

    @media (max-width: 1100px) {
      .modules-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modules-toolbar {
        grid-template-columns: 1fr;
      }

      .modules-status {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo" onclick="goPage('../index.html')">
    <img src="../Images/logo.png" alt="Logo Module 4">
    <span>Module 4 - Mécanique</span>
  </div>

  <nav>
    <button onclick="goPage('../index.html')">Accueil</button>
    <button onclick="goPage('espace-prof.html')">Espace Prof</button>
  </nav>
</header>

<main>

  <section id="guardLoader" class="prof-login-page">
    <div class="prof-login-card">
      <p class="kicker">Accès sécurisé</p>
      <h1>Vérification</h1>
      <p class="intro">Vérification de votre session professeur...</p>

      <div style="margin-top: 28px; display: flex; align-items: center; gap: 14px;">
        <div class="inline-loader"></div>
        <p class="intro" style="margin: 0;">Chargement sécurisé...</p>
      </div>
    </div>
  </section>

  <section id="protectedContent" class="prof-dashboard" hidden>
    <div class="prof-dashboard-top">
      <div>
        <p class="kicker">Suivi modules</p>
        <h1>Modules Élèves</h1>
        <p class="intro">
          Cochez les modules validés pour chaque élève. L’effectif vient du réglage partagé du site stage.
        </p>
      </div>

      <button class="btn secondary" onclick="goPage('espace-prof.html')">Retour</button>
    </div>

    <section class="inline-corrections active">
      <div class="inline-corrections-card modules-shell">
        <div id="modulesSummary" class="modules-summary"></div>

        <div class="modules-toolbar">
          <input id="modulesSearch" class="modules-search" type="text" autocomplete="off" placeholder="Rechercher nom ou ID Unique...">
          <button type="button" class="prof-admin-small-btn gold" id="reloadModulesBtn">Recharger</button>
          <span id="modulesStatus" class="modules-status"></span>
        </div>

        <div class="modules-table-wrap">
          <div id="modulesLoader" class="modules-page-loader">
            <div class="modules-loader-box">
              <div class="modules-spinner"></div>
              <p id="modulesLoaderText">Chargement de l’effectif...</p>
            </div>
          </div>

          <div id="modulesTable" class="modules-table"></div>
        </div>
      </div>
    </section>
  </section>

</main>

<script src="../assets/js/navigation.js?v=1001"></script>
<script type="module" src="../assets/js/prof-modules-eleves.js?v=1001"></script>

</body>
</html>
