  <style>
    body.modules-page {
      height: 100vh;
      overflow: hidden;
    }

    body.modules-page > header {
      display: none;
    }

    body.modules-page main {
      height: 100vh;
      overflow: hidden;
      padding: 8px;
    }

    body.modules-page .prof-dashboard,
    body.modules-page .inline-corrections,
    body.modules-page .inline-corrections-card {
      height: 100%;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
    }

    .modules-shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      padding: 10px !important;
      border-radius: 8px;
      overflow: hidden;
    }

    .modules-summary {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .modules-stat {
      min-height: 58px;
      padding: 9px 11px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(214,180,106,.08), rgba(255,255,255,.028)),
        rgba(255,255,255,.025);
    }

    .modules-stat span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .modules-stat strong {
      display: block;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      font-weight: 1000;
    }

    .modules-stat.done strong {
      color: #86efac;
    }

    .modules-toolbar {
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: rgba(255,255,255,.03);
    }

    .modules-back-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      background: rgba(255,255,255,.055);
      color: var(--text);
      font: inherit;
      font-size: 24px;
      font-weight: 1000;
      line-height: 1;
      cursor: pointer;
    }

    .modules-search {
      width: 100%;
      height: 42px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      outline: none;
    }

    .modules-reload-btn {
      height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(214,180,106,.30);
      border-radius: 8px;
      background: rgba(214,180,106,.12);
      color: var(--gold2);
      font: inherit;
      font-size: 12px;
      font-weight: 1000;
      cursor: pointer;
      white-space: nowrap;
    }

    .modules-sheets-btn {
      border-color: rgba(74,222,128,.32);
      background: rgba(74,222,128,.11);
      color: #86efac;
    }

    .modules-sheets-btn:hover {
      border-color: rgba(74,222,128,.52);
      background: rgba(74,222,128,.17);
    }

    .modules-status:empty {
      display: none;
    }

    .modules-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .modules-status[data-tone="ok"] {
      color: #86efac;
    }

    .modules-status[data-tone="error"] {
      color: #fca5a5;
    }

    .modules-status[data-tone="info"] {
      color: #7dd3fc;
    }

    .modules-table-wrap {
      position: relative;
      min-height: 0;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
    }

    .modules-table {
      min-width: 1700px;
    }

    .modules-row {
      display: grid;
      grid-template-columns: minmax(250px, 1.1fr) repeat(6, minmax(118px, .75fr) minmax(148px, .8fr));
      align-items: stretch;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .modules-row.head {
      position: sticky;
      top: 0;
      z-index: 2;
      background:
        linear-gradient(145deg, rgba(214,180,106,.14), rgba(255,255,255,.035)),
        rgba(12,12,12,.98);
      backdrop-filter: blur(14px);
    }

    .modules-row.head > div {

      color: var(--gold2);
      font-size: 11px;
      font-weight: 1000;
      text-transform: uppercase;
      border-right: 1px solid rgba(255,255,255,.07);
    }

    .modules-cell {
      min-width: 0;
      display: grid;
      align-items: center;
      padding: 9px 12px;
      border-right: 1px solid rgba(255,255,255,.055);
    }

    .modules-student strong {

      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modules-student span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .module-check {
      width: 100%;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid rgba(248,113,113,.28);
      border-radius: 999px;
      background: rgba(248,113,113,.10);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 1000;
      cursor: pointer;
      user-select: none;
      transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
    }

    .module-check:hover {
      transform: translateY(-1px);
    }

    .module-check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #86efac;
      cursor: pointer;
    }

    .module-check.checked {
      border-color: rgba(74,222,128,.38);
      background: rgba(74,222,128,.13);
      color: #86efac;
      box-shadow: 0 0 18px rgba(74,222,128,.10);
    }

    .module-check.saving,
    .module-date.saving {
      opacity: .68;
      pointer-events: none;
    }

    .module-date {
      width: 100%;
      height: 36px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 8px;
      background: rgba(0,0,0,.30);
      color: var(--text);
      padding: 0 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      outline: none;
    }

    .module-date:focus {
      border-color: rgba(214,180,106,.42);
      box-shadow: 0 0 0 3px rgba(214,180,106,.10);
    }

    .modules-empty,
    .modules-error {

      padding: 18px;
      border: 1px solid rgba(214,180,106,.18);
      border-radius: 8px;
      background: rgba(214,180,106,.08);
      color: var(--gold2);
      font-weight: 1000;
      line-height: 1.45;
      text-align: center;
    }

    .modules-error {
      border-color: rgba(248,113,113,.28);
      background: rgba(248,113,113,.10);
      color: #fca5a5;
    }

    .modules-page-loader {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(8,8,8,.74);
      backdrop-filter: blur(10px);
    }

    .modules-page-loader[hidden] {
      display: none !important;
    }

    .modules-loader-box {
      width: min(360px, 92%);
      padding: 20px;
      border: 1px solid rgba(214,180,106,.24);
      border-radius: 8px;
      background: rgba(18,18,18,.96);
      text-align: center;
    }

    .modules-spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border-radius: 999px;
      border: 3px solid rgba(214,180,106,.18);
      border-top-color: var(--gold2);
      animation: modulesSpin .75s linear infinite;
    }

    @keyframes modulesSpin {
      to { transform: rotate(360deg); }
    }

    body.modules-page.prof-v2-page main.v2-shell {
      height: 100vh;
      padding: 0;
    }

    body.modules-page .modules-v2-dashboard {

    body.modules-page .modules-v2-workspace {
      min-height: 0;
      overflow: hidden;
    }

    body.modules-page .modules-v2-content {
      min-height: 0;
      overflow: hidden;
      padding: 10px;
    }

    body.modules-page .modules-v2-guard {
      position: absolute;
      inset: 92px 16px 16px;
      z-index: 80;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid var(--v2-line-soft);
      border-radius: var(--v2-radius);
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--v2-gold) 10%, transparent), transparent 42%),
        color-mix(in srgb, var(--v2-bg) 82%, transparent);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px color-mix(in srgb, var(--v2-shadow) 70%, transparent);
    }

    body.modules-page .modules-v2-guard[hidden],
    body.modules-page .modules-v2-dashboard[hidden] {

    }

    body.modules-page .modules-v2-guard .prof-login-card {

      border: 1px solid var(--v2-line);

    body.modules-page .modules-v2-guard .prof-login-card h1 {

    body.modules-page .modules-shell {

<script>
  (() => {
    const storageKey = "profV2Theme";
    const profileKey = "profV2Profile";

    function applyTheme(theme) {
      const safeTheme = theme === "light" ? "light" : "dark";
      document.body.dataset.theme = safeTheme;

      try {
        localStorage.setItem(storageKey, safeTheme);
      } catch (error) {
        console.warn("Theme local indisponible :", error);
      }

      document.querySelectorAll("[data-theme-choice]").forEach(button => {
        button.classList.toggle("active", button.dataset.themeChoice === safeTheme);
      });
    }

    function readDisplayName() {
      try {
        const saved = JSON.parse(localStorage.getItem(profileKey) || "{}");
        return String(saved.displayName || "").trim();
      } catch (error) {
        return "";
      }
    }

    function getInitials(value) {
      return String(value || "prof")
        .split("@")[0]
        .split(/[\s._-]+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0]?.toUpperCase() || "")
        .join("") || "PR";
    }

    function syncUserPill() {
      const user = window.currentProfUser;
      const label = readDisplayName() || user?.email || "Professeur";
      const email = document.getElementById("modulesUserEmail");
      const initials = document.getElementById("modulesUserInitials");

      if (email) email.textContent = label;
      if (initials) initials.textContent = getInitials(label);
    }

    try {
      applyTheme(localStorage.getItem(storageKey) || document.body.dataset.theme || "dark");
    } catch (error) {
      applyTheme("dark");
    }

    document.querySelectorAll("[data-theme-choice]").forEach(button => {
      button.addEventListener("click", () => applyTheme(button.dataset.themeChoice));
    });

    syncUserPill();
    window.setTimeout(syncUserPill, 500);
    window.setTimeout(syncUserPill, 1200);
  })();
</script>
