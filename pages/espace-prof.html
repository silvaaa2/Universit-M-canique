<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Prof - Module 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="../Images/logo.png?v=22">
  <link rel="shortcut icon" type="image/png" href="../Images/logo.png?v=22">
  <link rel="stylesheet" href="../assets/css/base.css?v=1001">
  <link rel="stylesheet" href="../assets/css/header.css?v=1001">
  <link rel="stylesheet" href="../assets/css/buttons.css?v=1001">
  <link rel="stylesheet" href="../assets/css/loader.css?v=1001">
  <link rel="stylesheet" href="../assets/css/prof.css?v=9036">
</head>

<body>

<div id="loader">
  <div class="loader-box">
    <h2>Espace Prof</h2>
    <p id="loaderText">Chargement sécurisé...</p>
    <div class="loader-bar"><span></span></div>
  </div>
</div>

<div id="loginTransition" class="login-transition" hidden>
  <div class="transition-box">
    <div class="transition-spinner"></div>
    <h2>Connexion validée</h2>
    <p>Préparation de l’espace professeur...</p>
  </div>
</div>

<header>
  <div class="logo" onclick="goPage('../index.html')">
    <img src="../Images/logo.png" alt="Logo Module 4">
    <span>Module 4 - Mécanique</span>
  </div>

  <nav>
    <button onclick="goPage('../index.html')">Accueil</button>
    <button onclick="goPage('custom-facile.html')">Custom Facile</button>
    <button onclick="goPage('custom-moyen.html')">Custom Moyen</button>
    <button onclick="goPage('custom-difficile.html')">Custom Difficile</button>
  </nav>
</header>

<main>

  <section class="prof-login-page" id="loginSection">
    <div class="prof-login-card">
      <p class="kicker">Accès sécurisé</p>

      <h1>Espace Prof</h1>

      <p class="intro">
        Connectez-vous avec votre compte professeur pour accéder aux outils internes.
      </p>

      <form id="loginForm">
        <label for="email">Adresse mail</label>
        <input type="email" id="email" placeholder="prof@email.com" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" class="btn primary full" id="loginBtn">
          <span class="btn-text">Connexion</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p id="loginError" class="login-error"></p>
    </div>
  </section>

  <section class="prof-dashboard" id="profDashboard" hidden></section>

</main>

<script src="../assets/js/loader.js?v=1001"></script>
<script src="../assets/js/navigation.js?v=1001"></script>
<script type="module" src="../assets/js/prof-auth-safe.js?v=1001"></script>
<script type="module" src="../assets/js/prof-dashboard-hotfix.js?v=1001"></script>
<script src="../assets/js/prof-loader-unlock.js?v=1001"></script>

</body>
</html>
