<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <title>Connexion · Université Mécanique</title>
  <link rel="icon" type="image/png" href="/Images/favicon.png?v=23">
  <link rel="stylesheet" href="/assets/css/unified-access.css?v=3">
  <link rel="stylesheet" href="/assets/css/unified-motion.css?v=4">
  <script src="/assets/js/unified-motion.js?v=4"></script>
</head>
<body>
  <main class="access-shell">
    <section class="access-card" aria-labelledby="accessTitle">
      <header class="access-brand">
        <img src="/Images/logo.webp" width="76" height="76" alt="Logo Mécanique - Université">
        <p>PORTAIL UNIVERSITÉ</p>
        <h1 id="accessTitle">MÉCANIQUE<br><span>UNIVERSITÉ</span></h1>
      </header>

      <p class="access-copy">Choisissez votre espace pour continuer.</p>

      <button class="discord-button" id="discordAccessButton" type="button">
        <img src="/Images/discord-symbol.svg" alt="">
        <span>Continuer avec Discord</span>
      </button>
      <p class="form-status compact-status" id="discordStatus" aria-live="polite"></p>

      <button class="student-button" id="studentAccessButton" type="button">
        <span class="student-icon" aria-hidden="true">◇</span>
        <span>Continuer en tant qu’élève</span>
      </button>
      <p class="form-status compact-status" id="studentStatus" aria-live="polite"></p>

      <div class="access-separator" aria-hidden="true"><span>OU</span></div>

      <button class="company-toggle" id="companyAccessToggle" type="button" aria-expanded="false" aria-controls="companyAccessPanel">
        <span>Connexion avec un code entreprise</span>
        <b aria-hidden="true">⌄</b>
      </button>

      <div class="company-panel" id="companyAccessPanel" hidden>
        <form id="companyAccessForm" novalidate>
          <label for="companyCode">Code entreprise</label>
          <div class="code-row">
            <input id="companyCode" name="code" type="password" autocomplete="one-time-code" placeholder="Saisir le code" required>
            <button type="submit">Accéder</button>
          </div>
          <p class="form-status" id="companyStatus" aria-live="polite"></p>
        </form>
      </div>

      <footer>
        <span class="security-dot" aria-hidden="true"></span>
        Accès sécurisé · Université Mécanique
      </footer>
    </section>
  </main>

  <script type="module" src="/assets/js/unified-access.js?v=3"></script>
</body>
</html>
